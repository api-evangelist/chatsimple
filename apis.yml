apis:
- aid: chatsimple-zapier-leads-api
  name: Expertise AI Zapier / Leads API
  description: >-
    The only publicly documented HTTP endpoints Chatsimple (now Expertise AI)
    publishes. Documented on the Zapier integration page of docs.expertise.ai as
    four operations under the base URL https://api.expertise.ai/v0/users: a
    connect/authorize call (GET /zapier), webhook registration (POST
    /zapier/subscribe with the callback in X-HOOKURL), webhook removal (DELETE
    /zapier/unsubscribe), and retrieval of the most recent captured lead (GET
    /zapier/get_leads). Every call carries an X-API-KEY header plus X-USER-ID and
    X-CHATBOT-ID to scope it to one account and one agent. Lead payloads carry
    created_on, name, email, phone_number and questions. No OpenAPI is published
    for it, and on 2026-08-13 every documented path returned HTTP 404 to an
    anonymous request while the host itself was healthy — recorded as published
    but unverified.
  humanURL: https://docs.expertise.ai/live/integrations/zapier
  baseURL: https://api.expertise.ai/v0/users
  tags:
  - Lead Generation
  - Webhooks
  - Automation
  - Chatbot
  properties:
  - type: Documentation
    url: https://docs.expertise.ai/live/integrations/zapier
  - type: APIReference
    url: https://docs.expertise.ai/live/integrations/zapier
  - type: Authentication
