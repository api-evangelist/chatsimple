- aid: chatsimple-mcp-server
  name: Expertise AI MCP Server
  description: >-
    A remote Model Context Protocol server at https://api.expertise.ai/mcp,
    found by direct probe of the API host root and documented nowhere on the
    provider's site. It implements the MCP Streamable HTTP transport — a GET
    returns HTTP 405 with {"error":"SSE stream not supported"} and a POST returns
    well-formed JSON-RPC 2.0 — but every anonymous call, including tools/list,
    returns HTTP 401 with JSON-RPC error -32001 Unauthorized, so the live tool
    manifest and its input schemas are not publicly readable. The server
    implements the RFC 8414 and RFC 9728 discovery routes and answers both with
    {"error":"oauth_not_supported"}, so authentication is an API key rather than
    OAuth. No tool list has been derived or invented.
  humanURL: https://api.expertise.ai/mcp
  baseURL: https://api.expertise.ai/mcp
  tags:
  - MCP
  - AI Agents
  - Agent Tools
  properties:
  - type: MCPServer
    url: mcp/chatsimple-mcp.yml
  - type: Authentication
    url: authentication/chatsimple-authentication.yml
